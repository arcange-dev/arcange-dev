<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Arcange, hardware and software developer</title>
  <desc id="d">Banner with the name Arcange and a stack diagram running from electronics to intelligent systems.</desc>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F1F3F6" stroke-width="1"/>
    </pattern>
    <linearGradient id="a" x1="0" x2="1">
      <stop offset="0" stop-color="#1F5BFF"/><stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="#FFFFFF"/>
  <rect width="1200" height="320" fill="url(#g)"/>
  <rect x="64" y="200" width="120" height="4" rx="2" fill="url(#a)"/>
  <text x="64" y="168" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="104" font-weight="700" letter-spacing="-3" fill="#0A0A0A">Arcange</text>
  <text x="64" y="244" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" fill="#4B5563">Hardware &amp; Software Developer</text>
  <text x="64" y="284" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="18" fill="#4B5563">from silicon to software</text>
  <rect x="300" y="268" width="10" height="20" fill="#0891B2">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <line x1="740" y1="40" x2="740" y2="280" stroke="#D0D7DE" stroke-width="1.2" stroke-dasharray="3 5"/>
  <circle cx="740" cy="40" r="4" fill="#0891B2">
    <animate attributeName="cy" values="270;40;270" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g>
    <rect x="760" y="50" width="340" height="34" rx="6" fill="none" fill-opacity="1" stroke="#D0D7DE" stroke-width="1.2"/>
    <text x="776" y="72" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="14" fill="#4B5563">Electronics</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.00s" dur="0.6s" fill="freeze"/>
  </g>
  <g>
    <rect x="788" y="96" width="340" height="34" rx="6" fill="none" fill-opacity="1" stroke="#D0D7DE" stroke-width="1.2"/>
    <text x="804" y="118" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="14" fill="#4B5563">Firmware</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.25s" dur="0.6s" fill="freeze"/>
  </g>
  <g>
    <rect x="760" y="142" width="340" height="34" rx="6" fill="#1F5BFF" fill-opacity="0.12" stroke="#1F5BFF" stroke-width="1.2"/>
    <text x="776" y="164" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="14" fill="#0A0A0A">Operating systems</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.50s" dur="0.6s" fill="freeze"/>
  </g>
  <g>
    <rect x="788" y="188" width="340" height="34" rx="6" fill="none" fill-opacity="1" stroke="#D0D7DE" stroke-width="1.2"/>
    <text x="804" y="210" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="14" fill="#4B5563">Applications</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.6s" fill="freeze"/>
  </g>
  <g>
    <rect x="760" y="234" width="340" height="34" rx="6" fill="none" fill-opacity="1" stroke="#D0D7DE" stroke-width="1.2"/>
    <text x="776" y="256" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="14" fill="#4B5563">Intelligent systems</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.00s" dur="0.6s" fill="freeze"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
